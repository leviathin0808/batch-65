<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
</head>
<body>
    

    <div class="container">
        <div class="card contact-card">
            <h1>Get In Touch</h1>
            <p class="bio">Hubungi saya untuk pertanyaan atau kolaborasi</p>

            <form class="contact-form">
                <div class="form-group">
                    <label for="name">Nama Lengkap</label>
                    <input type="text" id="name" name="name" placeholder="Masukkan nama anda" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Masukkan email anda" required>
                </div>

                <div class="form-group">
                    <label for="phone">Nomor Telepon</label>
                    <input type="tel" id="phone" name="phone" placeholder="Masukkan nomor telepon anda">
                </div>

                <div class="form-group">
                    <label for="subject">Subjek</label>
                    <input type="text" id="subject" name="subject" placeholder="Masukkan subjek pesan" required>
                </div>

                <div class="form-group">
                    <label for="message">Pesan</label>
                    <textarea id="message" name="message" rows="5" placeholder="Tulis pesan anda di sini..." required></textarea>
                </div>

                <button type="submit" class="btn btn-submit">Kirim Pesan</button>
                <a href="index.html" class="btn btn-back">Kembali</a>
            </form>

            <div class="contact-info" style="margin-top: 30px;">
                <h3 style="color: #0f0c0c; margin-bottom: 15px;">Atau hubungi saya melalui:</h3>
                <p><strong>Email:</strong> kosong594@gmail.com</p>
                <p><strong>Phone:</strong> 0822-4667-2934</p>
                <p><strong>Location:</strong> siulak, Indonesia</p>
                <div style="margin-top: 15px;">
                    <a href="#" style="color: #0f0c0c; font-size: 20px; margin-right: 10px;"><i class="fa-brands fa-facebook"></i></a>
                    <a href="#" style="color: #0f0c0c; font-size: 20px; margin-right: 10px;"><i class="fa-brands fa-twitter"></i></a>
                    <a href="#" style="color: #0f0c0c; font-size: 20px; margin-right: 10px;"><i class="fa-brands fa-instagram"></i></a>
                    <a href="#" style="color: #0f0c0c; font-size: 20px;"><i class="fa-brands fa-telegram"></i></a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
